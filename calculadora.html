<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica - UMG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculadora {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 340px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .header h3 {
            margin: 0 0 5px 0;
            color: #007bff;
            font-size: 16px;
        }
        .header p {
            margin: 0;
            color: #555;
            font-size: 14px;
            font-weight: bold;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            font-size: 20px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 20px;
            padding: 12px;
            background-color: #e9ecef;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="calculadora">
    <div class="header">
        <h3>Universidad Mariano Gálvez</h3>
        <p>Bryan Alvarez</p>
    </div>

    <h2>Calculadora</h2>
    
    <div class="campo">
        <label for="num1">Número 1:</label>
        <input type="number" id="num1" step="any" placeholder="Ingrese un número">
    </div>

    <div class="campo">
        <label for="num2">Número 2:</label>
        <input type="number" id="num2" step="any" placeholder="Ingrese un número">
    </div>

    <div class="botones">
        <button onclick="calcular('sumar')">Sumar</button>
        <button onclick="calcular('restar')">Restar</button>
        <button onclick="calcular('multiplicar')">Multiplicar</button>
        <button onclick="calcular('dividir')">Dividir</button>
    </div>

    <div class="resultado" id="resultado">
        Resultado: 
    </div>
</div>

<script>
    function calcular(operacion) {
        const input1 = document.getElementById('num1').value;
        const input2 = document.getElementById('num2').value;
        const divResultado = document.getElementById('resultado');

        // Verificar que ambos campos contengan un número
        if (input1 === '' || input2 === '') {
            divResultado.innerHTML = "Error: Ingrese ambos números.";
            return;
        }

        const n1 = parseFloat(input1);
        const n2 = parseFloat(input2);

        if (isNaN(n1) || isNaN(n2)) {
            divResultado.innerHTML = "Error: Valores inválidos.";
            return;
        }

        let res = 0;

        switch (operacion) {
            case 'sumar':
                res = n1 + n2;
                break;
            case 'restar':
                res = n1 - n2;
                break;
            case 'multiplicar':
                res = n1 * n2;
                break;
            case 'dividir':
                // Evitar la división entre cero
                if (n2 === 0) {
                    divResultado.innerHTML = "Error: No se puede dividir entre cero.";
                    return;
                }
                res = n1 / n2;
                break;
        }

        divResultado.innerHTML = "Resultado: " + res;
    }
</script>

</body>
</html>
